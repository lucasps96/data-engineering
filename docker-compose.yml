services:
  minio:
    # Pinned: releases after 2025-05 ship a stripped-down console (object browser only).
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - data-net

  minio-client:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/bronze;
      mc mb -p local/silver;
      mc mb -p local/gold;
      tail -f /dev/null
      "
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - data-net

  airflow-db:
    image: postgres:16
    container_name: airflow-db
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - data-net

  airflow:
    build:
      context: .
      dockerfile: ./airflow/Dockerfile
    container_name: airflow
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # ${PWD}: caminho ABSOLUTO no HOST da raiz do projeto no momento do
      # `docker compose up`. anp_pipeline_dag.py usa isso para montar
      # data/anp/ nos containers py-toolbox via docker.sock do host — e
      # como todos os volumes deste arquivo já usam caminhos relativos
      # (./airflow/dags, ./data, ...), rodar o compose de fora da raiz do
      # projeto já quebraria tudo mesmo antes dessa variável existir.
      HOST_ANP_DIR: ${PWD}/data/anp
      # Precisa bater com networks.data-net.name, mais abaixo neste arquivo.
      PROJECT_NETWORK: data-engineering_data-net
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./spark:/app
      - ./data:/data
      - ./spark:/opt/spark
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8082:8080"
    # Literal block (|), not folded (>): a folded scalar turns the trailing "\"
    # line continuations into plain newlines, which splits each option onto its
    # own line and breaks the command.
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --role Admin --username ${AIRFLOW_ADMIN_USER} \
          --email ${AIRFLOW_ADMIN_EMAIL} --firstname Admin \
          --lastname User --password ${AIRFLOW_ADMIN_PASSWORD} || true
        airflow scheduler &
        exec airflow webserver
    restart: unless-stopped
    networks:
      - data-net
    group_add:
      - "110"

  spark-master:
    image: bitnamilegacy/spark:3.4
    hostname: spark-master
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_METRICS_ENABLED=true
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark:/app
      - ./data:/data
    restart: unless-stopped
    networks:
      - data-net

  spark-worker-1:
    image: bitnamilegacy/spark:3.4
    container_name: spark-worker-1
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      - ./spark:/app
      - ./data:/data
    restart: unless-stopped
    networks:
      - data-net

  spark-worker-2:
    image: bitnamilegacy/spark:3.4
    container_name: spark-worker-2
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    depends_on:
      - spark-master
    volumes:
      - ./spark:/app
      - ./data:/data
    restart: unless-stopped
    networks:
      - data-net

  spark-thrift-server:
    build:
      context: .      # assuming your Dockerfile is here
      dockerfile: ./spark/Dockerfile
    container_name: spark-thrift-server
    ports:
      - "10001:10001"
      - "10000:10000"
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    volumes:
      - ./spark:/app
      - ./data:/data
      # The Hive metastore. Without this volume it lives in the container
      # filesystem and is destroyed every time the container is recreated,
      # taking every schema and table registration with it while the data
      # survives in MinIO -- which is what makes `docker compose down`
      # (without --volumes) leave the lakehouse in a broken half state.
      - thrift_metastore:/metastore
    restart: unless-stopped
    networks:
      - data-net

  superset:
    build:
      context: .
      dockerfile: ./superset/Dockerfile
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - ADMIN_USERNAME=${SUPERSET_ADMIN_USER}
      - ADMIN_FIRST_NAME=Admin
      - ADMIN_LAST_NAME=User
      - ADMIN_EMAIL=${SUPERSET_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD}
      - DATABASE_URL=sqlite:////app/superset/superset.db
      # PATH/PYTHONPATH are not overridden here: the image already puts
      # /app/.venv/bin first on PATH, and overriding PYTHONPATH would shadow
      # /app/pythonpath (where superset_config.py is loaded from).
    volumes:
      - ./superset:/app/superset
    # Literal block (|), not folded (>): see the note on the airflow service.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        superset db upgrade
        superset fab create-admin \
          --username ${SUPERSET_ADMIN_USER} \
          --firstname Admin \
          --lastname User \
          --email ${SUPERSET_ADMIN_EMAIL} \
          --password ${SUPERSET_ADMIN_PASSWORD} || true
        superset init
        exec superset run -h 0.0.0.0 -p 8088
    restart: unless-stopped
    networks:
      - data-net

volumes:
  minio_data:
  airflow_db_data:
  thrift_metastore:

networks:
  data-net:
    # Nome fixo (em vez de deixar o Compose derivar de
    # "${nome-da-pasta}_data-net"): garante que anp_pipeline_dag.py
    # (PROJECT_NETWORK) sempre acerte o nome da rede, mesmo que o
    # repositório seja clonado em uma pasta com outro nome.
    name: data-engineering_data-net
    driver: bridge
